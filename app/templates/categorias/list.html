{% extends "base.html" %}
{% block title %}Gestionar categorías{% endblock %}
{% block content %}
<h2 class="mb-4">Gestionar categorías</h2>

<form method="POST" action="{{ url_for('categorias.nueva') }}" class="d-flex gap-2 mb-4" style="max-width: 400px;">
    <input type="text" name="nombre" class="form-control" placeholder="Nueva categoría" required>
    <button type="submit" class="btn btn-success text-nowrap">+ Agregar</button>
</form>

<table class="table table-striped" style="max-width: 600px;">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Libros</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for c in categorias %}
        <tr>
            <td>
                <form method="POST" action="{{ url_for('categorias.editar', categoria_id=c.id) }}" class="d-flex gap-2">
                    <input type="text" name="nombre" value="{{ c.nombre }}" class="form-control form-control-sm">
                    <button type="submit" class="btn btn-outline-primary btn-sm text-nowrap">Guardar</button>
                </form>
            </td>
            <td class="align-middle">{{ c.libros|length }}</td>
            <td class="align-middle">
                <form method="POST" action="{{ url_for('categorias.eliminar', categoria_id=c.id) }}"
                      onsubmit="return confirm('¿Eliminar esta categoría?');">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Eliminar</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="3">No hay categorías todavía.</td></tr>
        {% endfor %}
    </tbody>
</table>

<a href="{{ url_for('libros.listar') }}" class="btn btn-link ps-0">&larr; Volver al catálogo</a>
{% endblock %}
